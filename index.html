const fmt=v=>`R$ ${Number(v).toFixed(2).replace(".",",")}`;
const getDias=(dr,agora)=>{if(!dr)return null;const hoje=new Date(agora.toDateString());const ret=new Date(dr+"T00:00:00");return Math.ceil((ret-hoje)/86400000);};
const getPrazo=(dias,status)=>{if(status==="entregue"||dias===null)return null;if(dias<0)return{label:`${Math.abs(dias)}d atrasado`,color:"#e05555",bg:"#fff0f0",icon:"🚨"};if(dias===0)return{label:"Hoje!",color:"#e07020",bg:"#fff5e0",icon:"⚡"};if(dias===1)return{label:"Amanhã",color:AMARELO,bg:"#fffbe6",icon:"⏰"};if(dias<=3)return{label:`${dias}d`,color:ROSA,bg:ROSA_CLARO,icon:"📅"};return{label:`${dias}d`,color:"#888",bg:"#f5f5f5",icon:"📅"};};
const getBadge=o=>({bg:o.pago?"#eaf5f1":o.pagoParcial?"#fff8ec":"#fff5e0",color:o.pago?VERDE:o.pagoParcial?AMARELO:"#e8a020",text:o.pago?"💰 Pago":o.pagoParcial?`💛 Entrada ${fmt(o.entrada||0)}`:"⏳ A pagar"});

async function apiLoad(){
  try{
    const r=await fetch(`${SHEETS_URL}?action=load`);
    const d=await r.json();
    if(d.ok&&d.orders?.length>0)return d.orders;
  }catch(e){console.error(e);}
  return[];
}

async function apiSave(orders){
  try{
    const params=new URLSearchParams();
    params.append("action","save");
    params.append("orders",JSON.stringify(orders));
    await fetch(SHEETS_URL,{method:"POST",body:params});
  }catch(e){console.error(e);}
}

function PagamentoBtn({order,onUpdate}){
  const[modo,setModo]=useState(null);
  const[entrada,setEntrada]=useState(order.entrada||"");
  if(modo==="parcial")return(
    <div style={{background:"#fff8ec",borderRadius:10,padding:"10px 12px",border:"1.5px solid "+AMARELO}}>
      <div style={{fontSize:11,color:"#aaa",marginBottom:6}}>💵 Valor de entrada (R$)</div>
      <div style={{display:"flex",gap:6,alignItems:"center"}}>
        <input type="number" value={entrada} onChange={e=>setEntrada(e.target.value)} autoFocus style={{flex:1,padding:"7px 10px",borderRadius:8,border:"1.5px solid "+AMARELO,fontSize:13,outline:"none"}}/>
        <button onClick={()=>{onUpdate("parcial",entrada);setModo(null);}} style={{padding:"7px 12px",borderRadius:8,border:"none",background:AMARELO,color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}}>✓</button>
        <button onClick={()=>setModo(null)} style={{padding:"7px 10px",borderRadius:8,border:"1.5px solid #f0dde4",background:"#fff",color:"#aaa",fontSize:12,cursor:"pointer"}}>✕</button>
      </div>
    </div>
  );
  return(
    <div style={{display:"flex",gap:5}}>
      {[{k:"nao_pago",l:"⏳ A pagar",a:!order.pago&&!order.pagoParcial,c:"#e8b86d"},{k:"parcial",l:"💛 Parcial",a:order.pagoParcial,c:AMARELO},{k:"pago",l:"✅ Pago",a:order.pago,c:VERDE}].map(b=>(
        <button key={b.k} onClick={()=>b.k==="parcial"?setModo("parcial"):onUpdate(b.k,0)}
          style={{flex:1,padding:"5px 4px",borderRadius:8,border:"1.5px solid",borderColor:b.a?b.c:"#f0dde4",background:b.a?(b.k==="pago"?"#eaf5f1":b.k==="parcial"?"#fff8ec":"#fdf6e3"):"#fff",color:b.a?b.c:"#bbb",fontSize:10,fontWeight:700,cursor:"pointer"}}>
          {b.l}
        </button>
      ))}
    </div>
  );
}

      {o.status!=="entregue"&&<div style={{display:"flex",flexDirection:"column",alignItems:"center",minWidth:34,gap:2,paddingTop:2}}><div style={{width:30,height:30,borderRadius:"50%",background:prazo?.color||ROSA_MED,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:13}}>{idx+1}</div><div style={{fontSize:9,color:"#ccc",textTransform:"uppercase"}}>fila</div></div>}
      <div style={{flex:1,minWidth:180}}>
        <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:5,flexWrap:"wrap"}}>
          <span style={{fontSize:16}}>{st.icon}</span>
          <span style={{fontWeight:700,fontSize:15}}>{o.cliente}</span>
          <span style={{padding:"2px 7px",borderRadius:20,fontSize:11,fontWeight:700,background:st.bg,color:st.color}}>{st.label}</span>
          <span style={{padding:"2px 7px",borderRadius:20,fontSize:11,fontWeight:700,background:bp.bg,color:bp.color}}>{bp.text}</span>
          {prazo&&<span style={{padding:"2px 7px",borderRadius:20,fontSize:11,fontWeight:700,background:prazo.bg,color:prazo.color}}>{prazo.icon} {prazo.label}</span>}

        <div style={{fontSize:13,color:"#555",marginBottom:3}}>🥚 {o.itens}</div>
        <div style={{display:"flex",gap:10,fontSize:11,color:"#999",flexWrap:"wrap"}}>
          {o.telefone&&<span>📞 {o.telefone}</span>}
          {o.data_retirada&&<span>📅 {new Date(o.data_retirada+"T12:00").toLocaleDateString("pt-BR")}</span>}
          {o.valor&&<span>💵 {fmt(o.valor)}</span>}
          {o.endereco&&<span>📍 {o.endereco}</span>}
        </div>
        {o.observacoes&&<div style={{marginTop:4,fontSize:11,color:"#bbb",fontStyle:"italic"}}>📝 {o.observacoes}</div>}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:5,minWidth:155}}>
        <div style={{fontSize:10,color:"#ccc",textTransform:"uppercase",letterSpacing:1}}>Status</div>
        {Object.entries(STATUS).map(([k,v])=>(
          <button key={k} onClick={()=>onStatus(o.id,k)} style={{padding:"4px 10px",borderRadius:8,border:"1.5px solid",borderColor:o.status===k?v.color:"#f0dde4",background:o.status===k?v.bg:"#fff",color:o.status===k?v.color:"#bbb",fontSize:11,fontWeight:700,cursor:"pointer",textAlign:"left"}}>{v.icon} {v.label}</button>
        ))}
        <div style={{marginTop:4}}>
          <div style={{fontSize:10,color:"#ccc",textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>Pagamento</div>
          <PagamentoBtn order={o} onUpdate={onPagto}/>
        </div>
        <div style={{display:"flex",gap:5,marginTop:4}}>
          <button onClick={()=>onEdit(o)} style={{flex:1,padding:"5px 0",borderRadius:8,border:`1.5px solid ${ROSA_MED}`,background:ROSA_CLARO,color:ROSA_ESCURO,fontSize:11,cursor:"pointer"}}>✏️ Editar</button>

        </div>
      </div>
    </div>
  );
}

function FormModal({initial,onSave,onClose}){
  const[f,setF]=useState({cliente:"",telefone:"",data_retirada:"",tipo_entrega:"retirada",endereco:"",observacoes:"",forma_pagamento:"PIX",itens:"",valor:"",...initial});
  const[sel,setSel]=useState([]);
  const[busca,setBusca]=useState("");
  const[cat,setCat]=useState("Todas");
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const cats=["Todas",...Array.from(new Set(CARDAPIO.map(p=>p.cat)))];
  const filtros=CARDAPIO.filter(p=>(cat==="Todas"||p.cat===cat)&&p.nome.toLowerCase().includes(busca.toLowerCase()));
  const toggle=p=>setSel(prev=>prev.find(s=>s.nome===p.nome)?prev.filter(s=>s.nome!==p.nome):[...prev,{...p,qtd:1}]);
  const setQtd=(nome,q)=>setSel(prev=>prev.map(s=>s.nome===nome?{...s,qtd:Math.max(1,parseInt(q)||1)}:s));
  const total=sel.reduce((s,p)=>s+p.preco*(p.qtd||1),0);
  const itensStr=sel.map(p=>p.qtd>1?`${p.qtd}x ${p.nome}`:p.nome).join(" + ");
  const handleSave=()=>{
    if(!f.cliente.trim())return alert("Preencha o nome do cliente.");
    if(sel.length===0&&!f.itens.trim())return alert("Selecione pelo menos um produto.");
    onSave({...f,itens:sel.length>0?itensStr:f.itens,valor:sel.length>0?total:(parseFloat(f.valor)||0)});
  };
  const inp=(label,key,type="text",ph="")=>(
    <div style={{marginBottom:12}}>
      <label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:3,textTransform:"uppercase",letterSpacing:1}}>{label}</label>
      <input type={type} value={f[key]||""} onChange={e=>set(key,e.target.value)} placeholder={ph} style={{width:"100%",padding:"9px 12px",borderRadius:10,border:"1.5px solid #f0dde4",fontSize:13,outline:"none",boxSizing:"border-box"}}/>
    </div>
  );
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(180,48,74,0.18)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:900,padding:16}}>
      <div style={{background:"#fff",borderRadius:20,padding:24,width:"100%",maxWidth:520,boxShadow:"0 8px 40px rgba(180,48,74,0.18)",maxHeight:"92vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <h3 style={{margin:0,color:ROSA_ESCURO,fontSize:17}}>{f.id?"✏️ Editar":"✨ Novo Pedido"}</h3>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:"#ccc"}}>×</button>
        </div>
        {inp("Cliente *","cliente","text","Nome do cliente")}
        {inp("Telefone","telefone","tel","(11) 99999-9999")}
        <div style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <label style={{fontSize:10,color:"#aaa",textTransform:"uppercase",letterSpacing:1}}>🍫 Produtos</label>
            {sel.length>0&&<span style={{fontSize:11,color:ROSA_ESCURO,fontWeight:700}}>{sel.length} selecionado(s)</span>}
          </div>
          <div style={{display:"flex",gap:6,marginBottom:6}}>
            <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="🔍 Buscar..." style={{flex:1,padding:"7px 10px",borderRadius:8,border:"1.5px solid #f0dde4",fontSize:12,outline:"none"}}/>
            <select value={cat} onChange={e=>setCat(e.target.value)} style={{padding:"7px 8px",borderRadius:8,border:"1.5px solid #f0dde4",fontSize:11,outline:"none",color:"#555",maxWidth:130}}>
              {cats.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div style={{maxHeight:160,overflowY:"auto",border:"1.5px solid #f0dde4",borderRadius:10,padding:4}}>
            {filtros.map((p,i)=>{const s=sel.find(x=>x.nome===p.nome);return(
              <div key={i} onClick={()=>toggle(p)} style={{padding:"7px 10px",borderRadius:8,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,background:s?ROSA_CLARO:"transparent",borderLeft:s?`3px solid ${ROSA_ESCURO}`:"3px solid transparent",marginBottom:2}}>
                <div style={{flex:1}}><div style={{fontSize:12,fontWeight:s?700:400}}>{p.nome}</div>{p.obs&&<div style={{fontSize:10,color:"#bbb"}}>{p.obs}</div>}</div>
                <span style={{fontSize:12,fontWeight:700,color:ROSA_ESCURO}}>{fmt(p.preco)}</span>
                {s&&<span style={{fontSize:14,color:ROSA_ESCURO}}>✓</span>}
              </div>
            );})}
          </div>
          {sel.length>0&&(
            <div style={{marginTop:10,background:ROSA_CLARO,borderRadius:12,padding:12}}>
              {sel.map((p,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,background:"#fff",borderRadius:8,padding:"7px 10px"}}>
                  <div style={{flex:1,fontSize:12}}>{p.nome}</div>
                  <div style={{display:"flex",alignItems:"center",gap:4}}>
                    <button onClick={e=>{e.stopPropagation();setQtd(p.nome,(p.qtd||1)-1);}} style={{width:22,height:22,borderRadius:"50%",border:`1px solid ${ROSA_MED}`,background:"#fff",color:ROSA_ESCURO,fontSize:14,cursor:"pointer"}}>−</button>
                    <input type="number" min="1" value={p.qtd||1} onClick={e=>e.stopPropagation()} onChange={e=>setQtd(p.nome,e.target.value)} style={{width:36,textAlign:"center",border:`1px solid ${ROSA_MED}`,borderRadius:6,fontSize:12,padding:"2px 4px",outline:"none"}}/>
                    <button onClick={e=>{e.stopPropagation();setQtd(p.nome,(p.qtd||1)+1);}} style={{width:22,height:22,borderRadius:"50%",border:`1px solid ${ROSA_MED}`,background:ROSA_ESCURO,color:"#fff",fontSize:14,cursor:"pointer"}}>+</button>
                  </div>
                  <div style={{fontSize:12,fontWeight:700,color:ROSA_ESCURO,minWidth:64,textAlign:"right"}}>{fmt(p.preco*(p.qtd||1))}</div>
                  <button onClick={e=>{e.stopPropagation();toggle(p);}} style={{background:"none",border:"none",color:"#e07070",cursor:"pointer",fontSize:14,padding:0}}>✕</button>
                </div>
              ))}
              <div style={{display:"flex",justifyContent:"space-between",paddingTop:10,borderTop:`1.5px solid ${ROSA_MED}`,marginTop:4}}>
                <span style={{fontSize:12,color:"#888"}}>{sel.reduce((s,p)=>s+(p.qtd||1),0)} item(ns)</span>

              </div>
            </div>
          )}
        </div>
        {sel.length===0&&(
          <div style={{marginBottom:12}}>
            <label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:3,textTransform:"uppercase",letterSpacing:1}}>Descreva manualmente</label>
            <input value={f.itens} onChange={e=>set("itens",e.target.value)} placeholder="Ex: Ovo personalizado..." style={{width:"100%",padding:"9px 12px",borderRadius:10,border:"1.5px solid #f0dde4",fontSize:13,outline:"none",boxSizing:"border-box"}}/>
          </div>
        )}
        <div style={{display:"grid",gridTemplateColumns:sel.length>0?"1fr":"1fr 1fr",gap:10}}>
          {sel.length===0&&<div>{inp("Valor (R$)","valor","number","0,00")}</div>}
          <div style={{gridColumn:sel.length>0?"1/-1":"auto"}}>{inp("Data retirada","data_retirada","date")}</div>
        </div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>Tipo</label>
          <div style={{display:"flex",gap:8}}>
            {["retirada","entrega"].map(t=>(
              <button key={t} onClick={()=>set("tipo_entrega",t)} style={{flex:1,padding:"8px",borderRadius:10,border:"1.5px solid",borderColor:f.tipo_entrega===t?ROSA_ESCURO:"#f0dde4",background:f.tipo_entrega===t?ROSA_CLARO:"#fff",color:f.tipo_entrega===t?ROSA_ESCURO:"#aaa",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                {t==="retirada"?"🏪 Retirada":"🚚 Entrega"}
              </button>
            ))}
          </div>
        </div>
        {f.tipo_entrega==="entrega"&&inp("Endereço","endereco","text","Rua, número, bairro...")}
        <div style={{marginBottom:12}}>
          <label style={{fontSize:10,color:"#aaa",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>💳 Pagamento</label>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {["PIX","Débito","Crédito","Dinheiro"].map(pg=>(

            ))}
          </div>
        </div>
        {inp("Observações","observacoes","text","Sabor, personalização...")}
        <button onClick={handleSave} style={{width:"100%",padding:13,borderRadius:12,border:"none",background:`linear-gradient(135deg,${ROSA_ESCURO},${ROSA})`,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",marginTop:4}}>
          💾 Salvar {sel.length>0&&`— ${fmt(total)}`}
        </button>
      </div>
    </div>
  );
}

function App(){
  const[view,setView]=useState("pedidos");
  const[orders,setOrders]=useState([]);
  const[form,setForm]=useState(null);
  const[filter,setFilter]=useState("todos");
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  const[toast,setToast]=useState(null);
  const[agora,setAgora]=useState(new Date());
  const[nextId,setNextId]=useState(1);

  useEffect(()=>{
    setInterval(()=>setAgora(new Date()),60000);
    apiLoad().then(data=>{
      if(data.length>0){
        setOrders(data);
        setNextId(Math.max(...data.map(o=>o.id||0))+1);
      }
      setLoading(false);
    });
  },[]);

  const showToast=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};

  const persist=async(newOrders)=>{
    setSaving(true);
    await apiSave(newOrders);
    setSaving(false);
  };

  const saveOrder=async(data)=>{
    let newOrders;
    if(data.id){
      newOrders=orders.map(x=>x.id===data.id?{...x,...data}:x);
      showToast("Pedido atualizado! 💾");
    }else{
      const novo={...data,id:nextId,status:"pendente",pago:false,pagoParcial:false,entrada:0};
      newOrders=[novo,...orders];
      setNextId(n=>n+1);
      showToast("Pedido criado! 🎂");
    }
    setOrders(newOrders);
    setForm(null);
    await persist(newOrders);
  };

  const deleteOrder=async(id)=>{
    const newOrders=orders.filter(x=>x.id!==id);
    setOrders(newOrders);
    showToast("Removido.","err");
    await persist(newOrders);
  };

  const updStatus=async(id,s)=>{
    const newOrders=orders.map(x=>x.id===id?{...x,status:s}:x);
    setOrders(newOrders);
    await persist(newOrders);
  };

  const updPagamento=async(id,tipo,val)=>{
    const newOrders=orders.map(x=>x.id===id?{...x,pago:tipo==="pago",pagoParcial:tipo==="parcial",entrada:tipo==="parcial"?parseFloat(val)||0:tipo==="pago"?x.valor:0}:x);
    setOrders(newOrders);
    await persist(newOrders);
  };

  const totalRecebido=orders.filter(o=>o.pago).reduce((s,o)=>s+(o.valor||0),0)+orders.filter(o=>o.pagoParcial).reduce((s,o)=>s+(o.entrada||0),0);
  const totalAReceber=orders.filter(o=>!o.pago&&!o.pagoParcial).reduce((s,o)=>s+(o.valor||0),0)+orders.filter(o=>o.pagoParcial).reduce((s,o)=>s+((o.valor||0)-(o.entrada||0)),0);

  const lista=useMemo(()=>{
    const base=filter==="todos"?orders:orders.filter(o=>o.status===filter);
    return[...base].sort((a,b)=>{
      if(a.status==="entregue"&&b.status!=="entregue")return 1;
      if(b.status==="entregue"&&a.status!=="entregue")return -1;
      if(!a.data_retirada)return 1;if(!b.data_retirada)return -1;
      return a.data_retirada>b.data_retirada?1:-1;
    });
  },[orders,filter]);

  const naoEntregues=lista.filter(o=>o.status!=="entregue");
  const atrasados=orders.filter(o=>o.status!=="entregue"&&getDias(o.data_retirada,agora)<0);

  if(loading)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#fdf4f6",flexDirection:"column",gap:16}}>
      <div style={{fontSize:48}}>🎂</div>
      <div style={{fontSize:16,color:ROSA_ESCURO,fontWeight:700}}>Carregando pedidos...</div>
    </div>
  );

  return(
    <div style={{fontFamily:"Georgia,serif",minHeight:"100vh",background:"#fdf4f6",color:"#3a1a22"}}>
      <header style={{background:`linear-gradient(135deg,${ROSA_ESCURO},${ROSA} 60%,#e89aaa)`,boxShadow:"0 4px 20px rgba(180,48,74,0.25)"}}>
        <div style={{maxWidth:1080,margin:"0 auto",padding:"14px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:48,height:48,borderRadius:12,overflow:"hidden",background:"#fff",padding:3}}>
              <img src={LOGO} alt="Logo" style={{width:"100%",height:"100%",objectFit:"cover",borderRadius:9}}/>
            </div>
            <div>
              <div style={{fontSize:20,fontWeight:"bold",fontStyle:"italic",color:"#fff",letterSpacing:1}}>Celina's Cake</div>
              <div style={{fontSize:9,letterSpacing:3,color:"rgba(255,255,255,0.6)",textTransform:"uppercase"}}>
                🐣 Páscoa 2026 · {saving?"💾 salvando...":"✓ salvo"}
              </div>
            </div>
          </div>
          <nav style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {[["pedidos","📋 Pedidos"],["dashboard","📊 Painel"],["cardapio","🍫 Cardápio"]].map(([v,l])=>(
              <button key={v} onClick={()=>setView(v)} style={{padding:"7px 15px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,fontWeight:700,background:view===v?"#fff":"rgba(255,255,255,0.2)",color:view===v?ROSA_ESCURO:"#fff"}}>{l}</button>
            ))}
          </nav>
        </div>
      </header>

      <main style={{maxWidth:1080,margin:"0 auto",padding:"24px 20px"}}>

        {atrasados.length>0&&(
          <div style={{background:"#fff0f0",border:"2px solid #e05555",borderRadius:16,padding:"14px 18px",marginBottom:20}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
              <span style={{fontSize:22}}>🚨</span>
              <div style={{fontWeight:700,color:"#e05555",fontSize:15}}>{atrasados.length} pedido(s) atrasado(s)!</div>
            </div>
            {atrasados.map(o=>(
              <div key={o.id} style={{background:"#fff",borderRadius:10,padding:"10px 14px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",borderLeft:"4px solid #e05555",marginBottom:6}}>
                <div style={{flex:1}}><span style={{fontWeight:700,fontSize:13}}>{o.cliente}</span><span style={{fontSize:12,color:"#aaa",marginLeft:8}}>{o.itens}</span></div>
                <span style={{fontSize:11,color:"#e05555",fontWeight:700}}>{Math.abs(getDias(o.data_retirada,agora))}d atrasado</span>
                <button onClick={()=>updStatus(o.id,"entregue")} style={{padding:"4px 10px",borderRadius:8,border:"none",background:"#e05555",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer"}}>Marcar entregue</button>
              </div>
            ))}
          </div>
        )}

        {view==="pedidos"&&(
          <>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:12}}>
              <h2 style={{margin:0,fontSize:20,color:ROSA_ESCURO}}>📋 Pedidos ({orders.length})</h2>
              <button onClick={()=>setForm({})} style={{padding:"9px 20px",borderRadius:22,border:"none",background:`linear-gradient(135deg,${ROSA_ESCURO},${ROSA})`,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>+ Novo Pedido</button>
            </div>
            <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
              {[["todos","Todos"],...Object.entries(STATUS).map(([k,v])=>[k,`${v.icon} ${v.label}`])].map(([k,l])=>(
                <button key={k} onClick={()=>setFilter(k)} style={{padding:"6px 13px",borderRadius:20,border:"2px solid",borderColor:filter===k?ROSA_ESCURO:"#f0dde4",background:filter===k?ROSA_ESCURO:"#fff",color:filter===k?"#fff":"#888",fontSize:12,fontWeight:700,cursor:"pointer"}}>{l}</button>
              ))}
            </div>
            {lista.length===0?(
              <div style={{textAlign:"center",padding:"60px 0",color:"#ccc"}}>
                <div style={{fontSize:52}}>🥚</div>
                <div style={{marginTop:10,fontSize:15}}>Nenhum pedido ainda</div>
                <button onClick={()=>setForm({})} style={{marginTop:14,padding:"9px 22px",borderRadius:22,border:"none",background:`linear-gradient(135deg,${ROSA_ESCURO},${ROSA})`,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>+ Criar primeiro pedido</button>
              </div>
            ):(
              lista.map(o=>(
                <PedidoCard key={o.id} o={o} idx={naoEntregues.indexOf(o)} agora={agora}
                  onStatus={updStatus} onPagto={(tipo,val)=>updPagamento(o.id,tipo,val)}
                  onEdit={setForm} onDelete={deleteOrder}/>
              ))
            )}
          </>
        )}

        {view==="dashboard"&&(
          <>
            <h2 style={{margin:"0 0 16px",fontSize:20,color:ROSA_ESCURO}}>📊 Painel</h2>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:14,marginBottom:24}}>
              {[{label:"Total",value:orders.length,icon:"🎂",color:ROSA,bg:"#fff0f5"},{label:"Pendentes",value:orders.filter(o=>o.status==="pendente").length,icon:"⏳",color:"#e8b86d",bg:"#fdf6e3"},{label:"Prontos",value:orders.filter(o=>o.status==="pronto").length,icon:"✅",color:VERDE,bg:"#eaf5f1"},{label:"Recebido",value:fmt(totalRecebido),icon:"💰",color:VERDE,bg:"#eaf5f1"},{label:"A Receber",value:fmt(totalAReceber),icon:"⚠️",color:ROSA_ESCURO,bg:ROSA_CLARO}].map((c,i)=>(
                <div key={i} style={{background:c.bg,borderRadius:16,padding:"18px 16px",borderLeft:`4px solid ${c.color}`}}>
                  <div style={{fontSize:22}}>{c.icon}</div>
                  <div style={{fontSize:20,fontWeight:"bold",color:c.color,marginTop:4}}>{c.value}</div>
                  <div style={{fontSize:11,color:"#aaa",marginTop:2}}>{c.label}</div>
                </div>
              ))}
            </div>
            <div style={{background:"#fff",borderRadius:18,padding:20,marginBottom:18}}>
              <h3 style={{margin:"0 0 14px",fontSize:14,color:ROSA_ESCURO}}>📅 Próximas Entregas</h3>
              {orders.filter(o=>o.status!=="entregue"&&o.data_retirada).sort((a,b)=>a.data_retirada>b.data_retirada?1:-1).slice(0,8).map(o=>{
                const prazo=getPrazo(getDias(o.data_retirada,agora),o.status);const bp=getBadge(o);
                return(
                  <div key={o.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid #fce4ec",flexWrap:"wrap"}}>
                    <span style={{fontSize:18}}>{STATUS[o.status]?.icon}</span>
                    <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13}}>{o.cliente}</div><div style={{fontSize:11,color:"#aaa"}}>{o.itens}</div></div>
                    <div style={{fontSize:12,color:ROSA_ESCURO,fontWeight:700}}>{new Date(o.data_retirada+"T12:00").toLocaleDateString("pt-BR")}</div>
                    {prazo&&<span style={{padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:700,background:prazo.bg,color:prazo.color}}>{prazo.icon} {prazo.label}</span>}
                    <span style={{padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:700,background:bp.bg,color:bp.color}}>{bp.text}</span>
                  </div>
                );
              })}
            </div>
          </>
        )}

        {view==="cardapio"&&(
          <>
            <h2 style={{margin:"0 0 16px",fontSize:20,color:ROSA_ESCURO}}>🍫 Cardápio Páscoa 2026</h2>
            {Array.from(new Set(CARDAPIO.map(p=>p.cat))).map(cat=>(
              <div key={cat} style={{background:"#fff",borderRadius:16,marginBottom:14,overflow:"hidden"}}>
                <div style={{background:`linear-gradient(135deg,${ROSA_ESCURO},${ROSA})`,padding:"11px 18px"}}><span style={{color:"#fff",fontWeight:700,fontSize:14}}>{cat}</span></div>
                {CARDAPIO.filter(p=>p.cat===cat).map((p,i,arr)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 18px",borderBottom:i<arr.length-1?"1px solid #fce4ec":"none",gap:12}}>
                    <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{p.nome}</div>{p.obs&&<div style={{fontSize:11,color:"#aaa"}}>{p.obs}</div>}</div>
                    <span style={{fontSize:15,fontWeight:700,color:ROSA_ESCURO}}>{fmt(p.preco)}</span>
                  </div>
                ))}
              </div>
            ))}
          </>
        )}
      </main>

      {form!==null&&<FormModal initial={form} onSave={saveOrder} onClose={()=>setForm(null)}/>}
      {toast&&<div style={{position:"fixed",bottom:24,right:24,padding:"12px 20px",borderRadius:12,background:toast.type==="err"?"#e07070":ROSA_ESCURO,color:"#fff",fontSize:14,fontWeight:700,boxShadow:"0 4px 20px rgba(0,0,0,0.15)",zIndex:999}}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
