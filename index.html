<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Celina's Cake 🎂</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fdf4f6; color: #444; padding-bottom: 80px; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        button { cursor: pointer; transition: opacity 0.2s; }
        button:active { opacity: 0.7; }
        input, select, textarea { font-family: inherit; }
        .card { background: #fff; border-radius: 16px; padding: 15px; margin-bottom: 15px; border: 1px solid #fce4ec; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; text-align: center; }
        .progresso-bg { background: #eee; height: 8px; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .progresso-fill { background: #4a9b7f; height: 100%; transition: width 0.3s; }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- CONFIGURAÇÕES ---
    const ROSA="#d4607a", RE="#b5304a", RC="#fce4ec", RM="#f8bbd0", VE="#4a9b7f", AM="#e8a020";
    const LOGO = "https://static.ifood-static.com.br/image/upload/t_thumbnail/logosgde/118fefb7-ed84-42c0-af19-c3c81521be3d/202009252306_A4Vw_i.jpg";
    
    const fmt = v => `R$ ${Number(v).toFixed(2).replace(".", ",")}`;

    // --- COMPONENTE DE PAGAMENTO (CORRIGIDO) ---
    function PagBtn({order, onUpdate}) {
        const [modo, setModo] = useState(null);
        const [ent, setEnt] = useState(order.entrada || "");

        if (modo === "parcial") {
            return (
                <div style={{background: "#fff8ec", borderRadius: 10, padding: "10px 12px", border: "1.5px solid " + AM}}>
                    <div style={{fontSize: 11, color: "#aaa", marginBottom: 6}}>💵 Valor da Entrada (R$)</div>
                    <div style={{display: "flex", gap: 6}}>
                        <input type="number" value={ent} onChange={e => setEnt(e.target.value)} style={{flex: 1, padding: "8px", borderRadius: 8, border: "1px solid " + AM}}/>
                        <button onClick={() => { onUpdate({pago: false, pagoParcial: true, entrada: parseFloat(ent)}); setModo(null); }} style={{background: AM, color: "#fff", border: "none", padding: "8px 15px", borderRadius: 8, fontWeight: 'bold'}}>✓</button>
                        <button onClick={() => setModo(null)} style={{background: "#fff", border: "1px solid #ccc", padding: "8px", borderRadius: 8}}>✕</button>
                    </div>
                </div>
            );
        }

        return (
            <div style={{display: "flex", gap: 8}}>
                <button onClick={() => onUpdate({pago: true, pagoParcial: false, entrada: 0})} style={{flex: 1, padding: "10px", borderRadius: 10, border: "none", background: VE, color: "#fff", fontWeight: "bold"}}>💰 Tudo Pago</button>
                <button onClick={() => setModo("parcial")} style={{flex: 1, padding: "10px", borderRadius: 10, border: `1.5px solid ${AM}`, background: "#fff", color: AM, fontWeight: "bold"}}>💛 Entrada</button>
            </div>
        );
    }

    // --- ABA CHOCOLATE (NOVA) ---
    function ChocolatePage({ pedidos, estoqueFatias, setEstoqueFatias }) {
        // Cálculo de fatias necessárias (Fatias = Ovo Fatia 700g (6 fatias))
        // Filtramos apenas pedidos que NÃO foram entregues
        const fatiasPedidas = pedidos
            .filter(p => p.itens.toLowerCase().includes("fatia") && p.status !== "entregue")
            .length * 6;

        const fatiasEntregues = pedidos
            .filter(p => p.itens.toLowerCase().includes("fatia") && p.status === "entregue")
            .length * 6;

        // Controle de estoque de fatias prontas (ovos prontos na geladeira)
        const fatiasProntas = (estoqueFatias || 0) * 6;
        const faltamProduzir = Math.max(0, fatiasPedidas - fatiasProntas);

        // Cálculo de chocolate total (Exemplo simplificado)
        const chocolateTotal = pedidos.reduce((acc, p) => {
            const peso = p.itens.includes("250g") ? 0.25 : p.itens.includes("500g") ? 0.5 : p.itens.includes("800g") ? 0.8 : 0.7;
            const tipo = p.itens.toLowerCase().includes("branco") ? "branco" : p.itens.toLowerCase().includes("zero") ? "zero" : "aoLeite";
            acc[tipo] = (acc[tipo] || 0) + peso;
            return acc;
        }, { aoLeite: 0, branco: 0, zero: 0 });

        return (
            <div>
                <h2 style={{color: RE, marginBottom: 15}}>🍫 Gestão de Chocolate</h2>
                
                {/* Cards de Chocolate */}
                <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 20}}>
                    {Object.entries(chocolateTotal).map(([tipo, kg]) => (
                        <div key={tipo} className="card" style={{margin: 0, textAlign: 'center'}}>
                            <div style={{fontSize: 12, color: '#888', textTransform: 'capitalize'}}>{tipo}</div>
                            <div style={{fontSize: 18, fontWeight: 'bold', color: RE}}>{kg.toFixed(1)} kg</div>
                            <div style={{fontSize: 10, color: VE}}>{Math.ceil(kg)} barras de 1kg</div>
                        </div>
                    ))}
                </div>

                {/* Controle de Fatias */}
                <div className="card" style={{borderLeft: `5px solid ${ROSA}`}}>
                    <h3 style={{fontSize: 16, marginBottom: 10}}>🍰 Controle de Ovos Fatia</h3>
                    
                    <div className="progresso-bg">
                        <div className="progresso-fill" style={{width: `${(fatiasProntas / (fatiasPedidas || 1)) * 100}%`}}></div>
                    </div>

                    <div className="grid-3">
                        <div>
                            <div style={{fontSize: 18, fontWeight: 'bold'}}>{fatiasPedidas}</div>
                            <div style={{fontSize: 10, color: '#888'}}>PEDIDAS</div>
                        </div>
                        <div>
                            <div style={{fontSize: 18, fontWeight: 'bold', color: VE}}>{fatiasProntas}</div>
                            <div style={{fontSize: 10, color: '#888'}}>PRONTAS</div>
                        </div>
                        <div>
                            <div style={{fontSize: 18, fontWeight: 'bold', color: RE}}>{faltamProduzir}</div>
                            <div style={{fontSize: 10, color: '#888'}}>FALTAM</div>
                        </div>
                    </div>

                    <div style={{marginTop: 15, padding: 10, background: RC, borderRadius: 10, display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                        <span style={{fontSize: 13, fontWeight: 'bold'}}>Ovos inteiros prontos:</span>
                        <div style={{display: 'flex', alignItems: 'center', gap: 10}}>
                            <button onClick={() => setEstoqueFatias(Math.max(0, estoqueFatias - 1))} style={{width: 30, height: 30, borderRadius: '50%', border: 'none', background: '#fff', color: RE, fontWeight: 'bold'}}>-</button>
                            <span style={{fontWeight: 'bold'}}>{estoqueFatias}</span>
                            <button onClick={() => setEstoqueFatias(estoqueFatias + 1)} style={{width: 30, height: 30, borderRadius: '50%', border: 'none', background: RE, color: '#fff', fontWeight: 'bold'}}>+</button>
                        </div>
                    </div>
                    <div style={{fontSize: 11, color: '#888', marginTop: 8, textAlign: 'center'}}>
                        ℹ️ {fatiasEntregues} fatias já foram entregues aos clientes.
                    </div>
                </div>

                {/* Resumo de Compras */}
                <div className="card">
                    <h3 style={{fontSize: 15, marginBottom: 10}}>🛒 Resumo para Compra</h3>
                    <table style={{width: '100%', fontSize: 13, borderCollapse: 'collapse'}}>
                        <thead>
                            <tr style={{borderBottom: '1px solid #eee', textAlign: 'left'}}>
                                <th style={{padding: '5px'}}>Item</th>
                                <th style={{padding: '5px'}}>Total</th>
                                <th style={{padding: '5px'}}>Comprar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td style={{padding: '8px 5px'}}>Chocolate Ao Leite</td>
                                <td>{chocolateTotal.aoLeite.toFixed(1)}kg</td>
                                <td style={{fontWeight: 'bold'}}>{Math.ceil(chocolateTotal.aoLeite)} barras</td>
                            </tr>
                            <tr>
                                <td style={{padding: '8px 5px'}}>Chocolate Branco</td>
                                <td>{chocolateTotal.branco.toFixed(1)}kg</td>
                                <td style={{fontWeight: 'bold'}}>{Math.ceil(chocolateTotal.branco)} barras</td>
                            </tr>
                            <tr>
                                <td style={{padding: '8px 5px'}}>Chocolate Zero</td>
                                <td>{chocolateTotal.zero.toFixed(1)}kg</td>
                                <td style={{fontWeight: 'bold'}}>{Math.ceil(chocolateTotal.zero)} barras</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        );
    }

    // --- COMPONENTE PRINCIPAL (APP) ---
    function App() {
        const [aba, setAba] = useState("whatsapp");
        const [pedidos, setPedidos] = useState([]);
        const [estoqueFatias, setEstoqueFatias] = useState(0);

        // Funções de Gerenciamento
        const addPedido = (p) => setPedidos([...pedidos, { ...p, id: Date.now(), status: 'pendente' }]);
        const updatePedido = (id, campos) => setPedidos(pedidos.map(p => p.id === id ? { ...p, ...campos } : p));

        return (
            <div className="container">
                <header style={{textAlign: 'center', marginBottom: 20}}>
                    <img src={LOGO} style={{width: 60, borderRadius: '50%'}} />
                    <h1 style={{color: RE, fontSize: 22}}>Celina's Cake 🎂</h1>
                </header>

                {aba === "whatsapp" && (
                    <div className="card">
                        <h2 style={{color: RE, marginBottom: 10}}>💬 Novo Pedido</h2>
                        <button onClick={() => addPedido({cliente: "Ana", itens: "Ovo Fatia 700g", valor: 200})} style={{width: '100%', padding: 12, background: VE, color: '#fff', border: 'none', borderRadius: 8, fontWeight: 'bold'}}>
                            Simular Pedido de Ovo Fatia
                        </button>
                    </div>
                )}

                {aba === "pedidos" && (
                    <div>
                        <h2 style={{color: RE, marginBottom: 15}}>📋 Pedidos Atuais</h2>
                        {pedidos.map(p => (
                            <div key={p.id} className="card">
                                <strong>{p.cliente}</strong> - {p.itens}
                                <div style={{marginTop: 10, display: 'flex', gap: 5}}>
                                    <button onClick={() => updatePedido(p.id, {status: 'entregue'})} style={{fontSize: 10, background: VE, color: '#fff', border: 'none', padding: '5px 10px', borderRadius: 5}}>Marcar Entregue</button>
                                    <span style={{fontSize: 11, color: '#888'}}>Status: {p.status}</span>
                                </div>
                                <div style={{marginTop: 10}}>
                                    <PagBtn order={p} onUpdate={(c) => updatePedido(p.id, c)} />
                                </div>
                            </div>
                        ))}
                    </div>
                )}

                {aba === "chocolate" && (
                    <ChocolatePage 
                        pedidos={pedidos} 
                        estoqueFatias={estoqueFatias} 
                        setEstoqueFatias={setEstoqueFatias} 
                    />
                )}

                {/* Menu Fixo */}
                <nav style={{position: 'fixed', bottom: 0, left: 0, right: 0, background: '#fff', display: 'flex', borderTop: `1px solid ${RM}`, padding: '10px 0', justifyContent: 'space-around'}}>
                    <button onClick={() => setAba("whatsapp")} style={{background: 'none', border: 'none', color: aba === 'whatsapp' ? RE : '#aaa'}}>💬 WhatsApp</button>
                    <button onClick={() => setAba("pedidos")} style={{background: 'none', border: 'none', color: aba === 'pedidos' ? RE : '#aaa'}}>📋 Pedidos</button>
                    <button onClick={() => setAba("chocolate")} style={{background: 'none', border: 'none', color: aba === 'chocolate' ? RE : '#aaa'}}>🍫 Chocolate</button>
                </nav>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
</script>
</body>
</html>
