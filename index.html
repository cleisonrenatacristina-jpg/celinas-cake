<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Celina's Cake 🎂</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: #fdf4f6; padding-bottom: 80px; }
    .container { max-width: 520px; margin: 0 auto; padding: 20px; }
    input, button, textarea, select { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const {useState, useEffect, useMemo, useRef} = React;

const SHEETS_URL="https://script.google.com/macros/s/AKfycbyQoOmLI8KSHMUxYnp0YToNMbaIyDnmUPVpnS91f7Me1HVDSbXk3qEHeUzFtOqwo7755g/exec";
const ROSA="#d4607a", RE="#b5304a", RC="#fce4ec", RM="#f8bbd0", VE="#4a9b7f", AM="#e8a020";
const LOGO="https://static.ifood-static.com.br/image/upload/t_thumbnail/logosgde/118fefb7-ed84-42c0-af19-c3c81521be3d/202009252306_A4Vw_i.jpg";

const fmt=v=>`R$ ${Number(v).toFixed(2).replace(".",",")}`;

// --- COMPONENTE DE PAGAMENTO CORRIGIDO ---
function PagBtn({order, onUpdate}) {
    const [modo, setModo] = useState(null);
    const [ent, setEnt] = useState(order.entrada || "");

    if (modo === "parcial") {
        return (
            <div style={{background: "#fff8ec", borderRadius: 10, padding: "10px 12px", border: "1.5px solid " + AM, marginTop: 8}}>
                <div style={{fontSize: 11, color: "#aaa", marginBottom: 6}}>💵 Entrada (R$)</div>
                <div style={{display: "flex", gap: 6, alignItems: "center"}}>
                    <input type="number" value={ent} onChange={e => setEnt(e.target.value)} autoFocus style={{flex: 1, padding: "7px 10px", borderRadius: 8, border: "1.5px solid " + AM, fontSize: 13, outline: "none"}}/>
                    <button onClick={() => { onUpdate({pago: false, pagoParcial: true, entrada: parseFloat(ent)}); setModo(null); }} style={{padding: "7px 12px", borderRadius: 8, border: "none", background: AM, color: "#fff", fontWeight: 700, fontSize: 12, cursor: "pointer"}}>✓</button>
                    <button onClick={() => setModo(null)} style={{padding: "7px 10px", borderRadius: 8, border: "1.5px solid #f0dde4", background: "#fff", color: "#aaa", fontSize: 12, cursor: "pointer"}}>✕</button>
                </div>
            </div>
        );
    }

    return (
        <div style={{display: "flex", gap: 8, marginTop: 8}}>
            <button onClick={() => onUpdate({pago: true, pagoParcial: false, entrada: 0})} style={{flex: 1, padding: "8px", borderRadius: 10, border: "none", background: VE, color: "#fff", fontWeight: 700, cursor: "pointer"}}>💰 Tudo Pago</button>
            <button onClick={() => setModo("parcial")} style={{flex: 1, padding: "8px", borderRadius: 10, border: `1.5px solid ${AM}`, background: "#fff", color: AM, fontWeight: 700, cursor: "pointer"}}>💛 Entrada</button>
        </div>
    );
}

// --- NOVA ABA CHOCOLATE COM SEU VISUAL ---
function ChocolatePage({ pedidos, fatiasProntas, setFatiasProntas }) {
    const fatiasPedidas = pedidos.filter(p => p.itens.toLowerCase().includes("fatia") && p.status !== 'entregue').length * 6;
    const fatiasEntregues = pedidos.filter(p => p.itens.toLowerCase().includes("fatia") && p.status === 'entregue').length * 6;
    const totalProntas = fatiasProntas * 6;
    const faltam = Math.max(0, fatiasPedidas - totalProntas);
    const pct = fatiasPedidas > 0 ? (totalProntas / fatiasPedidas) * 100 : 0;

    const calcChocolate = () => {
        let resumo = { "Ao Leite": 0, "Branco": 0, "Zero": 0 };
        pedidos.forEach(p => {
            const peso = p.itens.includes("250g") ? 0.25 : p.itens.includes("500g") ? 0.5 : p.itens.includes("800g") ? 0.8 : 0.7;
            if (p.itens.toLowerCase().includes("branco")) resumo["Branco"] += peso;
            else if (p.itens.toLowerCase().includes("zero")) resumo["Zero"] += peso;
            else resumo["Ao Leite"] += peso;
        });
        return resumo;
    };
    const choco = calcChocolate();

    return (
        <div style={{animation: "fadeIn 0.3s ease"}}>
            <h2 style={{color: RE, marginBottom: 15, fontSize: 20}}>🍫 Produção de Chocolate</h2>
            
            <div style={{display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20}}>
                {Object.entries(choco).map(([tipo, kg]) => (
                    <div key={tipo} style={{background: "#fff", padding: 12, borderRadius: 16, border: `1px solid ${RM}`, textAlign: 'center'}}>
                        <div style={{fontSize: 11, color: "#aaa", textTransform: 'uppercase'}}>{tipo}</div>
                        <div style={{fontSize: 18, fontWeight: 700, color: RE}}>{kg.toFixed(1)}kg</div>
                        <div style={{fontSize: 10, color: VE, fontWeight: 700}}>{Math.ceil(kg)} barras de 1kg</div>
                    </div>
                ))}
            </div>

            <div style={{background: "#fff", padding: 16, borderRadius: 16, border: `2px solid ${ROSA}`, marginBottom: 20}}>
                <h3 style={{fontSize: 14, color: RE, marginBottom: 12, display: 'flex', justifyContent: 'space-between'}}>
                    🍰 Controle de Fatias <span>{totalProntas}/{fatiasPedidas}</span>
                </h3>
                <div style={{background: "#eee", height: 10, borderRadius: 5, overflow: 'hidden', marginBottom: 15}}>
                    <div style={{background: VE, width: `${Math.min(100, pct)}%`, height: '100%', transition: '0.5s'}} />
                </div>
                <div style={{display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, textAlign: 'center', marginBottom: 15}}>
                    <div><div style={{fontSize: 16, fontWeight: 700}}>{fatiasPedidas}</div><div style={{fontSize: 9, color: "#aaa"}}>PEDIDAS</div></div>
                    <div><div style={{fontSize: 16, fontWeight: 700, color: VE}}>{totalProntas}</div><div style={{fontSize: 9, color: "#aaa"}}>PRONTAS</div></div>
                    <div><div style={{fontSize: 16, fontWeight: 700, color: RE}}>{faltam}</div><div style={{fontSize: 9, color: "#aaa"}}>FALTAM</div></div>
                </div>
                <div style={{background: RC, padding: 10, borderRadius: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                    <span style={{fontSize: 12, fontWeight: 700}}>Ovos Prontos (Estoque):</span>
                    <div style={{display: 'flex', alignItems: 'center', gap: 12}}>
                        <button onClick={() => setFatiasProntas(Math.max(0, fatiasProntas-1))} style={{width: 28, height: 28, borderRadius: 8, border: "none", background: "#fff", color: RE, fontWeight: 700}}>-</button>
                        <span style={{fontWeight: 700}}>{fatiasProntas}</span>
                        <button onClick={() => setFatiasProntas(fatiasProntas+1)} style={{width: 28, height: 28, borderRadius: 8, border: "none", background: RE, color: "#fff", fontWeight: 700}}>+</button>
                    </div>
                </div>
            </div>

            <div style={{background: "#fff", padding: 15, borderRadius: 16, border: `1px solid ${RM}`}}>
                <h3 style={{fontSize: 14, color: RE, marginBottom: 10}}>🛒 Resumo de Compra</h3>
                {Object.entries(choco).map(([tipo, kg]) => (
                    <div key={tipo} style={{display: 'flex', justifyContent: 'space-between', padding: '6px 0', borderBottom: '1px solid #fce4ec', fontSize: 13}}>
                        <span>{tipo}</span>
                        <strong>{Math.ceil(kg)} barras de 1kg</strong>
                    </div>
                ))}
            </div>
        </div>
    );
}

function App() {
    const [aba, setAba] = useState("whatsapp");
    const [pedidos, setPedidos] = useState([]);
    const [fatiasProntas, setFatiasProntas] = useState(0);

    const addPedido = (novo) => {
        setPedidos([...pedidos, { ...novo, id: Date.now(), status: 'pendente' }]);
        setAba("pedidos");
    };

    const updPedido = (id, campos) => {
        setPedidos(pedidos.map(p => p.id === id ? { ...p, ...campos } : p));
    };

    return (
        <div className="container">
            <header style={{textAlign: 'center', marginBottom: 20}}>
                <img src={LOGO} style={{width: 50, borderRadius: '50%'}} />
                <h1 style={{color: RE, fontSize: 20}}>Celina's Cake 🎂</h1>
            </header>

            {aba === "whatsapp" && (
                <div style={{background: "#fff", padding: 20, borderRadius: 18, border: `2px solid ${RM}`}}>
                    <h2 style={{color: RE, fontSize: 16, marginBottom: 10}}>💬 Novo Pedido IA</h2>
                    <button onClick={() => addPedido({cliente: "Simulação", itens: "Ovo Fatia 700g", valor: 200})} style={{width: '100%', padding: 12, background: VE, color: '#fff', border: 'none', borderRadius: 10, fontWeight: 700}}>Simular Novo Ovo Fatia</button>
                </div>
            )}

            {aba === "pedidos" && (
                <div>
                    {pedidos.map(p => (
                        <div key={p.id} style={{background: "#fff", padding: 15, borderRadius: 16, marginBottom: 10, borderLeft: `5px solid ${ROSA}`}}>
                            <div style={{display: 'flex', justifyContent: 'space-between'}}>
                                <strong>{p.cliente}</strong>
                                <span style={{fontSize: 10, color: p.status === 'entregue' ? VE : AM}}>{p.status.toUpperCase()}</span>
                            </div>
                            <div style={{fontSize: 13, margin: '5px 0'}}>{p.itens}</div>
                            <div style={{display: 'flex', gap: 5}}>
                                <button onClick={() => updPedido(p.id, {status: 'entregue'})} style={{fontSize: 10, padding: '4px 8px', borderRadius: 5, border: 'none', background: RC, color: RE}}>Entregar</button>
                            </div>
                            <PagBtn order={p} onUpdate={(c) => updPedido(p.id, c)} />
                        </div>
                    ))}
                </div>
            )}

            {aba === "chocolate" && (
                <ChocolatePage pedidos={pedidos} fatiasProntas={fatiasProntas} setFatiasProntas={setFatiasProntas} />
            )}

            <nav style={{position: 'fixed', bottom: 0, left: 0, right: 0, background: '#fff', display: 'flex', borderTop: `1px solid ${RM}`, padding: '10px 0'}}>
                <button onClick={() => setAba("whatsapp")} style={{flex: 1, background: 'none', border: 'none', color: aba === 'whatsapp' ? RE : '#aaa', fontWeight: 700}}>💬 IA</button>
                <button onClick={() => setAba("pedidos")} style={{flex: 1, background: 'none', border: 'none', color: aba === 'pedidos' ? RE : '#aaa', fontWeight: 700}}>📋 Pedidos</button>
                <button onClick={() => setAba("chocolate")} style={{flex: 1, background: 'none', border: 'none', color: aba === 'chocolate' ? RE : '#aaa', fontWeight: 700}}>🍫 Choco</button>
            </nav>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
